<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAShop — Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-wrap { max-width: 440px; margin: 4rem auto; }
  .auth-wrap h1 { font-size: 2rem; }
</style>
</head>
<body>
<header id="header"></header>
<main>
  <div class="auth-wrap">
    <h1>Login</h1>
    <p class="subtitle">SOAP LoginUser → JWT Token авна — Lab06 Bonus</p>

    <div class="flow">
      <span class="fn fn-client">Frontend</span>
      <span class="fa">→</span>
      <span class="fn fn-soap">SOAP LoginUser</span>
      <span class="fa">→</span>
      <span class="fn fn-service">JWT Token</span>
      <span class="fa">→</span>
      <span class="fn fn-client">localStorage</span>
    </div>

    <div class="card">
      <div class="card-title">Нэвтрэх <span class="badge badge-soap">SOAP</span></div>

      <div class="form-grid one">
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" placeholder="seller1">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••">
        </div>
      </div>

      <button class="btn btn-success" id="loginBtn" onclick="doLogin()">
        <span id="loginSpin" class="spin" style="display:none"></span>
        Login & Get Token
      </button>
      <div id="login-alert" class="alert"></div>

      <div id="token-section" style="display:none; margin-top:1rem">
        <div class="field">
          <label>JWT Token (Lab06 Bonus)</label>
          <div class="token-box" id="token-box"></div>
        </div>
      </div>

      <div class="divider">эсвэл</div>
      <div style="text-align:center">
        <a href="register.html" style="color:var(--accent);font-size:0.85rem">Бүртгэл үүсгэх → Register</a>
      </div>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderHeader('');

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      return showAlert('login-alert', 'error', 'Username, password оруулна уу');
    }

    document.getElementById('loginSpin').style.display = 'inline-block';
    document.getElementById('loginBtn').disabled = true;

    try {
      const xml = await soapCall(`
        <auth:LoginUserRequest>
          <auth:username>${username}</auth:username>
          <auth:password>${password}</auth:password>
        </auth:LoginUserRequest>`);

      const success = extractXml(xml, 'success');
      const token   = extractXml(xml, 'token');
      const role    = extractXml(xml, 'role');
      const message = extractXml(xml, 'message');

      if (success === 'true' && token) {
        saveAuth(token, username, role || 'CUSTOMER');
        document.getElementById('token-box').textContent = token;
        document.getElementById('token-section').style.display = 'block';
        showAlert('login-alert', 'success', `✅ Login амжилттай! Role: ${role}. Products руу шилжиж байна...`);
        setTimeout(() => window.location.href = 'products.html', 2000);
      } else {
        showAlert('login-alert', 'error', '❌ ' + message);
      }
    } catch(e) {
      showAlert('login-alert', 'error', 'SOAP Error: ' + e.message);
    }

    document.getElementById('loginSpin').style.display = 'none';
    document.getElementById('loginBtn').disabled = false;
  }
</script>
</body>
</html>
