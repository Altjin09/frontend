<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAShop — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="header"></header>
<main>
  <div class="narrow">
    <h1>Login</h1>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Нэвтрэх</span>
        <span class="badge badge-soap">SOAP</span>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr">
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" placeholder="seller1">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••">
        </div>
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
        <span id="loginSpin" class="spin" style="display:none"></span>
        Login
      </button>
      <div id="login-alert" class="alert"></div>
      <div id="token-section" style="display:none;margin-top:1rem">
        <div class="field">
          <label>JWT Token</label>
          <div class="token-box" id="token-box"></div>
        </div>
      </div>
      <div class="divider">эсвэл</div>
      <div style="text-align:center;font-size:0.85rem">
        <a href="register.html">Бүртгэл үүсгэх</a>
      </div>
    </div>
  </div>
</main>
<script src="js/app.js"></script>
<script>
  renderHeader('');
  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) return showAlert('login-alert', 'error', 'Username, password оруулна уу');
    document.getElementById('loginSpin').style.display = 'inline-block';
    document.getElementById('loginBtn').disabled = true;
    try {
      const xml = await soapCall(`
        <auth:LoginUserRequest>
          <auth:username>${username}</auth:username>
          <auth:password>${password}</auth:password>
        </auth:LoginUserRequest>`);
      const success = extractXml(xml, 'success');
      const token   = extractXml(xml, 'token');
      const role    = extractXml(xml, 'role');
      const message = extractXml(xml, 'message');
      if (success === 'true' && token) {
        saveAuth(token, username, role || 'CUSTOMER');
        document.getElementById('token-box').textContent = token;
        document.getElementById('token-section').style.display = 'block';
        showAlert('login-alert', 'success', `Login амжилттай! Role: ${role}`);
        setTimeout(() => window.location.href = 'products.html', 2000);
      } else {
        showAlert('login-alert', 'error', message || 'Нэвтрэхэд алдаа гарлаа');
      }
    } catch(e) {
      showAlert('login-alert', 'error', 'SOAP Error: ' + e.message);
    }
    document.getElementById('loginSpin').style.display = 'none';
    document.getElementById('loginBtn').disabled = false;
  }
</script>
</body>
</html>
