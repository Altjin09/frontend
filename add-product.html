<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAShop — Add Product</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .wrap { max-width: 600px; margin: 0 auto; }
</style>
</head>
<body>
<header id="header"></header>
<main>
  <div class="wrap">
    <h1>Add Product</h1>
    <p class="subtitle">Lab06: REST POST /api/products — SOAP middleware шалгана</p>

    <div class="flow">
      <span class="fn fn-client">Frontend</span>
      <span class="fa">→</span>
      <span class="fn fn-gateway">Gateway</span>
      <span class="fa">→</span>
      <span class="fn fn-service">Product Service</span>
      <span class="fa">→</span>
      <span class="fn fn-soap">SOAP ValidateToken</span>
      <span class="fa">→</span>
      <span class="fn fn-service">PostgreSQL</span>
    </div>

    <div class="card">
      <div class="card-title">Шинэ бараа <span class="badge badge-rest">REST POST</span></div>

      <div class="form-grid">
        <div class="field">
          <label>Бараанд нэр *</label>
          <input type="text" id="name" placeholder="MacBook Pro">
        </div>
        <div class="field">
          <label>Ангилал</label>
          <input type="text" id="category" placeholder="Electronics">
        </div>
        <div class="field">
          <label>Үнэ ($) *</label>
          <input type="number" id="price" placeholder="999.99" step="0.01">
        </div>
        <div class="field">
          <label>Нөөц</label>
          <input type="number" id="stock" placeholder="10" value="10">
        </div>
        <div class="field full">
          <label>Тайлбар</label>
          <textarea id="description" placeholder="Барааны дэлгэрэнгүй тайлбар..."></textarea>
        </div>
        <div class="field full">
          <label>Зургийн URL (DO Spaces)</label>
          <input type="text" id="imageUrl" placeholder="https://ecommerce-products.sgp1.digitaloceanspaces.com/...">
          <small style="color:var(--muted);font-size:0.7rem;margin-top:0.2rem">Upload хэсэгт зураг upload хийгаад URL-г энд оруулна</small>
        </div>
      </div>

      <div style="display:flex;gap:1rem;margin-top:1.2rem">
        <button class="btn btn-primary" id="addBtn" onclick="addProduct()" style="margin-top:0">
          <span id="addSpin" class="spin" style="display:none"></span>
          Add Product
        </button>
        <a href="files.html" class="btn btn-outline" style="margin-top:0;text-decoration:none">🖼️ Upload Image</a>
        <a href="products.html" class="btn btn-outline" style="margin-top:0;text-decoration:none">← Back</a>
      </div>

      <div id="add-alert" class="alert"></div>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderHeader('add-product');

  // Pre-fill image URL from localStorage if coming from upload
  window.onload = () => {
    const url = localStorage.getItem('last_upload_url');
    if (url) {
      document.getElementById('imageUrl').value = url;
      localStorage.removeItem('last_upload_url');
    }
  };

  async function addProduct() {
    if (!requireAuth()) return;

    const name  = document.getElementById('name').value.trim();
    const price = parseFloat(document.getElementById('price').value);

    if (!name || !price) {
      return showAlert('add-alert', 'error', 'Нэр болон үнэ заавал оруулна уу');
    }

    document.getElementById('addSpin').style.display = 'inline-block';
    document.getElementById('addBtn').disabled = true;

    try {
      const { data, status, ok } = await apiPost('/api/products', {
        name,
        category:    document.getElementById('category').value.trim() || 'General',
        price,
        stock:       parseInt(document.getElementById('stock').value) || 0,
        description: document.getElementById('description').value.trim(),
        imageUrl:    document.getElementById('imageUrl').value.trim() || null
      });

      if (ok) {
        showAlert('add-alert', 'success', `✅ Бараа нэмэгдлээ! ID: ${data.id}`);
        setTimeout(() => window.location.href = 'products.html', 1500);
      } else if (status === 401 || status === 403) {
        showAlert('add-alert', 'error', '❌ Эрх хүрэхгүй байна. SELLER эрхтэйгээр нэвтрэнэ үү.');
      } else {
        showAlert('add-alert', 'error', `❌ Алдаа: ${status}`);
      }
    } catch(e) {
      showAlert('add-alert', 'error', 'Gateway error: ' + e.message);
    }

    document.getElementById('addSpin').style.display = 'none';
    document.getElementById('addBtn').disabled = false;
  }
</script>
</body>
</html>
