<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAShop — Products</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="header"></header>
<main>
  <h1>Products</h1>
  <div class="card">
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:0.75rem">
        <span class="card-title">Бараанууд</span>
        <span class="badge badge-rest">REST GET</span>
        <div class="cache-pill">
          <div class="cdot" id="cdot"></div>
          <span id="cache-label">—</span>
        </div>
      </div>
      <div style="display:flex;gap:0.5rem">
        <button class="btn btn-outline btn-sm" onclick="loadProducts()">Refresh</button>
        <a href="add-product.html" class="btn btn-primary btn-sm" style="text-decoration:none">+ Add</a>
      </div>
    </div>
    <div id="products-container">
      <div class="empty">Ачааллаж байна...</div>
    </div>
  </div>
</main>
<script src="js/app.js"></script>
<script>
  renderHeader('products');
  async function loadProducts() {
    try {
      const { data, cache } = await apiGet('/api/products');
      const dot = document.getElementById('cdot');
      const label = document.getElementById('cache-label');
      if (cache === 'HIT') { dot.className = 'cdot hit'; label.textContent = 'CACHE HIT'; }
      else { dot.className = 'cdot miss'; label.textContent = 'CACHE MISS'; }
      const container = document.getElementById('products-container');
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty">Бараа байхгүй байна. SELLER эрхтэйгээр нэвтрэн бараа нэмнэ үү.</div>';
        return;
      }
      container.innerHTML = `<div class="product-grid">${data.map(p => `
        <div class="prod-card">
          ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}" onerror="this.style.display='none'">` : ''}
          <div class="prod-name">${p.name}</div>
          <div class="prod-price">$${p.price}</div>
          <div class="prod-meta"><span>${p.category || '—'}</span><span>Stock: ${p.stock}</span></div>
          <div class="prod-id">${p.id}</div>
          <button class="btn btn-outline btn-sm" style="width:100%;margin-top:0.5rem;justify-content:center"
            onclick="orderProduct('${p.id}')">Order</button>
        </div>`).join('')}</div>`;
    } catch(e) {
      document.getElementById('products-container').innerHTML =
        `<div class="empty">Gateway-д холбогдож чадсангүй: ${e.message}</div>`;
    }
  }
  function orderProduct(productId) {
    window.location.href = `orders.html?productId=${productId}`;
  }
  loadProducts();
</script>
</body>
</html>
